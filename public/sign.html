<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>/* 預設淺色；在後台按「深色」才切換，記在這台裝置 */try{document.documentElement.dataset.theme=localStorage.getItem('theme')==='dark'?'dark':'light';document.documentElement.dataset.palette=localStorage.getItem('palette')||'garlic'}catch(e){document.documentElement.dataset.theme='light'}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>確認配送單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3EA; --surface:#FFFFFF; --ink:#1B2A21; --muted:#5B6B60; --line:#D6E0D0;
  --leaf:#2F6B45; --leaf-soft:#DCEBDD; --tag:#F5D547; --alert:#B23A2E; --line-green:#06C755;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111915; --surface:#1A241E; --ink:#E4ECE5; --muted:#98A99E; --line:#2B3A31;
    --leaf:#78C093; --leaf-soft:#22362A; --alert:#E0776B;
  }
}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#1A241E; --ink:#E4ECE5; --muted:#98A99E; --line:#2B3A31;
  --leaf:#78C093; --leaf-soft:#22362A; --alert:#E0776B;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.head{background:var(--line-green);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
.head b{display:block;font-size:1.15rem}
.head small{opacity:.95}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:1.05rem}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--muted);font-size:.8rem}
.row b{white-space:nowrap}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:1.15rem;padding-top:8px;border-top:2px solid var(--ink);margin-top:4px}
.note{color:var(--muted);font-size:.88rem}
#signer{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:22px;padding:11px;font-weight:700}
.acts .go{background:var(--line-green);border-color:var(--line-green);color:#fff}
.acts .go:disabled{opacity:.6}
.err{color:var(--alert);font-weight:700}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;margin:4px 0 10px;padding:10px 12px;background:var(--leaf-soft);border-radius:8px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--leaf)}
.plink{color:var(--alert);font-weight:700}
.done{text-align:center;padding:24px 8px}
.done .ok{font-size:3rem;line-height:1}
.done a{display:inline-block;margin-top:14px;background:var(--line-green);color:#fff;text-decoration:none;font-weight:700;border-radius:24px;padding:12px 24px}
.pad{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:flex-end;justify-content:center}
.pad.on{display:flex}
.pad .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.pad h2{margin:0 0 4px;font-size:1.05rem}
.pad canvas{display:block;width:100%;height:200px;background:#fff;border:2px dashed var(--line);border-radius:10px;touch-action:none;margin-top:8px}
.msg{text-align:center;color:var(--muted);padding:40px 16px}
[hidden]{display:none!important}
.photo{display:block;margin:10px 0 6px;font-size:.95rem}
.photo input{display:block;margin-top:6px;max-width:100%}
.photopv{display:block;max-width:100%;max-height:240px;border-radius:10px;margin:6px 0 10px}
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/brand.js"></script>
</head>
<body class="sign">
<div class="head"><span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 2.5c1.3 2.4 1.2 4.7.3 6.6C22 10.4 27.5 14.7 27.5 20.6c0 5.6-5.1 8.9-11.5 8.9S4.5 26.2 4.5 20.6c0-5.9 5.5-10.2 11.2-11.5-.9-1.9-1-4.2.3-6.6z" fill="currentColor"/><path d="M16 11.5c-2.6 2.9-3.6 6.1-3.6 9.3 0 3 1.1 5.5 3.6 7.4m0-16.7c2.6 2.9 3.6 6.1 3.6 9.3 0 3-1.1 5.5-3.6 7.4" stroke="#1F4D3A" stroke-opacity=".55" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg></span><div class="ht"><b id="title">確認配送單</b><small id="sub"></small></div></div>
<div class="wrap">
  <div class="msg" id="msg">載入中…</div>
  <div id="main" hidden>
    <div class="card"><h2>幫您配好的貨</h2><div id="items"></div><div class="total" id="total" hidden></div><p class="note" id="pnote" hidden>單價確認後，金額會在收據或對帳單上通知您。</p></div>
    <div class="card" id="signCard">
      <h2>請核對品項和數量</h2>
      <label class="chk"><input type="checkbox" id="received"> 品項和數量正確</label>
      <input id="signer" placeholder="確認人姓名（選填）" maxlength="20" aria-label="確認人姓名">
      <label class="photo"><span>📷 拍貨物照片（選填）</span><input type="file" id="photo" accept="image/*" capture="environment"></label>
      <img id="photoPv" class="photopv" alt="剛拍的貨物照片" hidden>
      <label class="chk"><input type="checkbox" id="absent"> 店家不在，只拍照留存（不用簽名）</label>
      <p class="err" id="err" role="alert"></p>
      <div class="acts"><button class="go" id="ok">確認</button></div>
    </div>
    <p style="text-align:center"><a id="problem" class="plink" hidden>數量不對？告訴老闆</a></p>
  </div>
  <div class="done" id="done" hidden></div>
</div>
<div class="pad" id="pad" role="dialog" aria-modal="true" aria-labelledby="padTitle">
  <div class="sheet">
    <h2 id="padTitle">請在框裡簽名</h2>
    <p class="note">用手指簽就可以，簽完按「確認」。</p>
    <canvas id="cv" aria-label="簽名區"></canvas>
    <p class="err" id="padErr" role="alert"></p>
    <div class="acts"><button id="padBack">返回</button><button id="padClear">重簽</button><button class="go" id="padOk">確認</button></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
// 和 functions/lib/qty.js 的 qtyText 一樣：斤用「幾斤幾兩」
function qtyText(q,unit){q=Number(q)||0;if(unit==='斤'&&!Number.isInteger(q)){let j=Math.floor(q),l=Math.round((q-j)*16);if(l===16){j++;l=0}if(Math.abs(j+l/16-q)<0.001)return `${j?j+'斤':''}${l?l+'兩':''}`||'0斤'}return `${Number.isInteger(q)?q:+q.toFixed(2)} ${unit}`}
const T=new URLSearchParams(location.search).get('t')||'';
let D=null;

// 老闆在後台選的配色
function applyPalette(p){if(!p)return;document.documentElement.dataset.palette=p;try{localStorage.setItem('palette',p)}catch{}}
async function load(){
  let r;
  try{r=await fetch('/api/sign?t='+encodeURIComponent(T));D=await r.json()}catch{D={error:'載入失敗，請重新整理'}}
  applyPalette(D.palette);
  applyBrand({logo:D.logo});
  if(!r?.ok){$('msg').textContent=D.error;return}
  document.title=`${D.store} 確認配送單`;
  $('title').textContent=`${D.store}・確認配送單`;
  $('sub').textContent=`${D.shopName}　${D.dateLabel} 配送${D.seq>1?`（補單 #${D.seq}）`:''}`;
  // 核對的重點是數量：數量放大放右邊；實出和叫的不一樣用紅字標出來；金額放小字
  $('items').innerHTML=D.items.map(i=>`<div class="row"><span>${esc(i.name)}${i.qty!==i.ordered?`<small class="diff">叫 ${esc(qtyText(i.ordered,i.unit))}，實際 ${i.qty?esc(qtyText(i.qty,i.unit)):'缺貨'}</small>`:''}${i.amount!=null&&i.qty?`<small>${money(i.price)} × ${esc(qtyText(i.qty,i.unit))} ＝ ${money(i.amount)}</small>`:''}</span>
    <b class="q ${i.qty!==i.ordered?'chg':''}">${i.qty?esc(qtyText(i.qty,i.unit)):'缺貨'}</b></div>`).join('');
  if(D.total!=null){$('total').hidden=false;$('total').innerHTML=`<span>合計</span><span>${money(D.total)}</span>`}else $('pnote').hidden=false;
  $('msg').hidden=true;$('main').hidden=false;
  // 「數量不對」：打開聊天室帶好開頭，店家補上哪裡不對
  if(D.basicId&&!D.confirmed){$('problem').hidden=false;$('problem').href=`https://line.me/R/oaMessage/${encodeURIComponent(D.basicId)}/?${encodeURIComponent(`${D.dateLabel} 配送單${D.seq>1?` 補單#${D.seq}`:''}有問題：`)}`}
  if(D.confirmed)showDone(D.confirmed,true);
}

// 貨物照片：手機照片很大，先縮到長邊 1280、JPEG 再傳
let PHOTO='';
$('photo').addEventListener('change',async e=>{
  const f=e.target.files[0];PHOTO='';$('photoPv').hidden=true;if(!f)return;
  try{
    const img=await createImageBitmap(f),k=Math.min(1,1280/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    for(const q of [0.7,0.5,0.35]){PHOTO=c.toDataURL('image/jpeg',q);if(PHOTO.length<650000)break}
    $('photoPv').src=PHOTO;$('photoPv').hidden=false;$('err').textContent='';
  }catch{$('err').textContent='照片讀不到，請再拍一次'}
});
// 第一次按確認：檢查勾選，跳出簽名板；店家不在的話直接用照片送出
function submit(){
  if(!$('received').checked){$('err').textContent='請先核對，勾選「品項和數量正確」';return}
  if($('absent').checked){if(!PHOTO){$('err').textContent='店家不在的話，請先拍一張貨物放置的照片';return}post(null);return}
  $('err').textContent='';$('padErr').textContent='';
  $('pad').classList.add('on');sizePad();
}
// 簽名板：先顯示再量尺寸，畫布才不會是 0
const cv=$('cv'),cx=cv.getContext('2d');let inked=false,drawing=false;
function sizePad(){
  const r=Math.min(window.devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*r;cv.height=h*r;cx.setTransform(r,0,0,r,0,0);
  cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.lineWidth=2.6;cx.lineCap=cx.lineJoin='round';cx.strokeStyle='#111';inked=false;
}
const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);cx.beginPath();cx.moveTo(...pt(e))});
cv.addEventListener('pointermove',e=>{if(!drawing)return;cx.lineTo(...pt(e));cx.stroke();inked=true});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drawing=false));
$('padClear').addEventListener('click',sizePad);
$('padBack').addEventListener('click',()=>$('pad').classList.remove('on'));
// 第二次按確認：連同簽名一起送出
async function send(){
  if(!inked){$('padErr').textContent='請先簽名';return}
  post(cv.toDataURL('image/png'));
}
// png：簽名圖；null 是店家不在、只拍照
async function post(png){
  const btn=png?$('padOk'):$('ok'),errEl=png?$('padErr'):$('err');
  btn.disabled=true;btn.textContent='送出中…';errEl.textContent='';
  try{
    const r=await fetch('/api/sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:T,signer:$('signer').value.trim(),confirmed:true,...(png?{png}:{absent:true}),...(PHOTO?{photo:PHOTO}:{})})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'送出失敗');
    $('pad').classList.remove('on');showDone(j.confirmed,false);
  }catch(e){errEl.textContent=e.message;btn.disabled=false;btn.textContent='確認'}
}
$('padOk').addEventListener('click',send);
function showDone(s,already){
  $('signCard').hidden=true;$('problem').hidden=true;
  const at=new Date(s.at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
  // 「回傳給老闆」：打開官方帳號聊天室並帶好一句話，店家按送出就好（不花推播額度）
  const text=`已確認 ${D.dateLabel} 配送單${D.seq>1?` 補單#${D.seq}`:''}`;
  const back=D.basicId?`https://line.me/R/oaMessage/${encodeURIComponent(D.basicId)}/?${encodeURIComponent(text)}`:'';
  $('done').hidden=false;
  $('done').innerHTML=`<div class="ok" aria-hidden="true">✅</div><h2 style="margin:8px 0 4px">${already?'這張配送單已經確認過了':'已確認，謝謝！'}</h2>
    <p class="note">${at}${s.signer?`・${esc(s.signer)}`:''}</p>${!already&&back?`<a href="${back}">回傳給老闆</a><p class="note">按了會打開 LINE 聊天室，再按送出就好</p>`:''}`;
}
$('ok').addEventListener('click',submit);
load();
</script>
</body>
</html>
